name: Native CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libmpv-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config

      - name: Install Windows native libraries
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-mpv

      - name: Add Windows native tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Install macOS native libraries
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_UPGRADE=1
          brew install mpv
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Show macOS build environment
        if: runner.os == 'macOS'
        run: |
          echo "--- target ---"
          rustup target list --installed
          echo "--- clang ---"
          clang --version | head -1
          echo "--- mpv pkg-config ---"
          pkg-config --modversion mpv 2>&1 || echo "pkg-config: mpv not found"
          echo "--- mpv libs ---"
          ls "$(brew --prefix)/lib" | grep -i mpv || echo "no mpv .dylib/.a in $(brew --prefix)/lib"
          echo "--- env ---"
          echo "LIBRARY_PATH=${LIBRARY_PATH:-<unset>}"
          echo "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH:-<unset>}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked --target ${{ matrix.target }}

      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --locked --target ${{ matrix.target }} -- --test-threads=1

[package]
name = "rustify-player"
version = "1.5.2"
edition = "2024"
description = "Native desktop music player built with Rust, GPUI, and libmpv"
license = "MIT"
repository = "https://github.com/1arley/rustify"
readme = "README.md"
keywords = ["music", "player", "spotify", "youtube", "gpui"]
categories = ["multimedia::audio"]
exclude = [".github/", ".cargo/", "docs/", "graphify-out/"]

[[bin]]
name = "rustify"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
dirs = "=5.0.1"
gpui = "=0.2.2"
gpui-component = "=0.5.0"
libc = "=0.2.189"
libmpv = { package = "libmpv2", version = "=7.0.1", default-features = false }
open = "=5.4.5"
rand = "=0.9.5"
rfd = "=0.18.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
ureq = { version = "=3.5.2", features = ["json"] }
url = "=2.5.8"

# shortcut: Cargo.lock holds libc at 0.2.189 for GPUI 0.2.2's xattr 0.2.3 build; remove when that dependency chain is updated.

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

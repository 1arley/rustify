[package]
name = "rea-spotify"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "=0.22.1"
gpui = "=0.2.2"
gpui-component = "=0.5.0"
libc = "=0.2.189"
libmpv = { package = "libmpv2", version = "=7.0.1", default-features = false }
rand = "=0.9.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
ureq = { version = "=3.5.2", features = ["json"] }
url = "=2.5.8"

# shortcut: Cargo.lock holds libc at 0.2.189 for GPUI 0.2.2's xattr 0.2.3 build; remove when that dependency chain is updated.
